<!doctype html><meta charset="utf-8"><title>convert</title>
<script type="importmap">{ "imports": { "three": "/poc/npm/package/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from '/poc/loaders/FBXLoader.js';
import { GLTFExporter } from '/poc/exporters/GLTFExporter.js';

const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
// specular map -> roughness (glTF reads roughness from the green channel); shiny = smooth
async function roughFromSpec(url, base) {
  const im = await loadImg(url), c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) { const s = (d.data[i] + d.data[i + 1] + d.data[i + 2]) / 765, r = Math.round(255 * Math.min(1, Math.max(0.25, base + 0.35 - s * 0.9))); d.data[i] = 0; d.data[i + 1] = r; d.data[i + 2] = 0; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); t.userData.mimeType = 'image/jpeg'; t.flipY = true; return t;
}
const texL = new THREE.TextureLoader();
const tex = (url, srgb) => new Promise((res) => texL.load(url, (t) => { t.flipY = true; if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.userData.mimeType = url.endsWith('.png') ? 'image/png' : 'image/jpeg'; res(t); }, undefined, () => res(null)));

window.convertAvatar = async (name) => {
  const dir = `/rbx/av/${name}/`;
  const files = await (await fetch(dir)).text();      // python http.server directory listing
  const have = new Set([...files.matchAll(/href="([^"]+)"/g)].map((m) => decodeURIComponent(m[1])));
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier((u) => { const f = u.split(/[\\/]/).pop().replace(/\.tga$/i, ''); if (have.has(f + '.jpg')) return dir + f + '.jpg'; if (have.has(f + '.png')) return dir + f + '.png'; return u; });
  const root = await new FBXLoader(mgr).loadAsync(dir + name + '.fbx');
  const mats = new Map(); const info = [];
  const jobs = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const conv = (m) => {
      if (mats.has(m)) return mats.get(m);
      const nm = new THREE.MeshStandardMaterial({ name: m.name, color: 0xffffff, metalness: 0, roughness: 0.7, side: THREE.FrontSide });
      const key = have.has(`${m.name}_color.jpg`) || have.has(`${m.name}_color.png`) ? m.name : null, mapName = m.name;
      info.push({ mat: m.name, map: mapName, key });
      jobs.push((async () => {
        if (key) {
          const isOpa = /opacity/.test(mapName);
          nm.map = await tex(dir + (have.has(`${key}_color.png`) ? `${key}_color.png` : `${key}_color.jpg`), true);
          if (isOpa) { nm.transparent = false; nm.alphaTest = 0.4; nm.side = THREE.DoubleSide; nm.roughness = 0.6; }
          if (!isOpa && have.has(`${key}_normal.jpg`)) nm.normalMap = await tex(dir + `${key}_normal.jpg`, false);
          if (!isOpa && have.has(`${key}_specular.jpg`)) nm.roughnessMap = await roughFromSpec(dir + `${key}_specular.jpg`, /head/.test(key) ? 0.45 : 0.6);
          if (nm.roughnessMap) nm.roughness = 1;
        } else if (m.color) nm.color.copy(m.color);
        if (m.transparent && !nm.alphaTest) { nm.alphaTest = 0.4; nm.side = THREE.DoubleSide; }
      })());
      mats.set(m, nm); return nm;
    };
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
    o.castShadow = true;
  });
  await Promise.all(jobs);
  root.animations = []; window.__root = root;
  const box = new THREE.Box3().setFromObject(root);
  const glb = await new GLTFExporter().parseAsync(root, { binary: true, maxTextureSize: 1024 });
  return { b64: btoa(new Uint8Array(glb).reduce((s, c) => s + String.fromCharCode(c), '')), info, h: box.max.y - box.min.y, tris: (() => { let t = 0; root.traverse((o) => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return t; })(), bones: (() => { let n = []; root.traverse((o) => { if (o.isBone && n.length < 6) n.push(o.name); }); return n; })() };
};

// all clips on one skeleton: rotation tracks for every bone, position only for the pelvis, resampled to 20 fps
window.convertAnims = async (list) => {
  const L = new FBXLoader(); let host = null; const clips = [];
  for (const n of list) {
    const r = await L.loadAsync(`/rbx/anim/${n}.fbx`);
    if (!host) host = r;
    const c = r.animations[0]; if (!c) continue;
    c.name = n.replace(/\.fbx$/, '');
    c.tracks = c.tracks.filter((t) => t.name.endsWith('.quaternion') || (t.name.endsWith('.position') && /Pelvis|Bip01\.position|^Bip01\./.test(t.name)));
    for (const t of c.tracks) {
      const sz = t.getValueSize(), T = t.times, V = t.values, step = 1 / 20, nt = [], nv = [];
      let last = -1;
      for (let i = 0; i < T.length; i++) if (T[i] - last >= step - 1e-4 || i === T.length - 1) { last = T[i]; nt.push(T[i]); for (let k = 0; k < sz; k++) nv.push(V[i * sz + k]); }
      t.times = new Float32Array(nt); t.values = new Float32Array(nv);
    }
    clips.push(c);
  }
  host.traverse((o) => { if (o.isMesh) o.visible = false; });
  const glb = await new GLTFExporter().parseAsync(host, { binary: true, animations: clips, onlyVisible: false });
  return { b64: btoa(new Uint8Array(glb).reduce((s, c) => s + String.fromCharCode(c), '')), clips: clips.map((c) => [c.name, +c.duration.toFixed(2), c.tracks.length]) };
};
window.ready = true;
</script>
